# Force Java 17 to avoid version conflicts
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# Reduced memory allocation due to system memory constraints
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+UseStringDeduplication

# Disable parallel processing to reduce memory usage
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official